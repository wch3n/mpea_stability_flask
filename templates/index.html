{% extends 'base.html' %}
{% block title %} MPEA stability {% endblock %}
{% block content %}
<div>
  <h4>Thermodynamic stability prediction for multi-principal element alloys</h4>
  <form class="form-row pt-4" method="post">
    <div class="col-6 pt-2">
      <label class="sr-only" for="formula">Formula</label>
      <input class="form-control mr-sm-2" id="formula" type="text" name="formula"
             placeholder="Al0.1CoCrFeMnNi" required maxlength="256" autofocus value="{{ request.form.get('formula', '') }}">
    </div>
    <div class="col-auto pt-2">
      <label class="sr-only" for="t_fac">T_fac</label>
      <div class="input-group mb-0">
        <input class="form-control mr-0" type="number" id="t_fac" name="t_fac" required
               step="0.05" min="0" max="1" value="{{ request.form.get('t_fac', '0.9') }}">
        <div class="input-group-append">
          <span class="input-group-text">Tm</span>
        </div>
      </div>
    </div>
    <div class="col-auto pt-2">
      <button class="btn btn-outline-success" type="submit">Predict</button>
    </div>
  </form>
  {% if error %}<p class="text-danger" role="alert">{{ error }}</p>{% endif %}
</div>
{% endblock %}
