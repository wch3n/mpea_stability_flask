{% extends 'base.html' %}
{% block content %}
<section class="hero predictor">
  <h1>Predict alloy stability</h1>
  <p class="lead">Enter a formula with 2–8 supported elements and choose a temperature as a fraction of the estimated melting point.</p>
  <form method="post">
    <label>Alloy formula<input type="text" name="formula" placeholder="Al0.1CoCrFeMnNi" required maxlength="256" value="{{ request.form.get('formula', '') }}"></label>
    <label>Temperature factor (T/T<sub>m</sub>)<input type="number" name="t_fac" required step="0.05" min="0" max="1" value="{{ request.form.get('t_fac', '0.9') }}"></label>
    <button type="submit">Predict</button>
  </form>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
</section>
{% endblock %}
