<figure class="lattice">
  <svg viewBox="0 0 372 216" role="img" aria-label="Schematic plane of a random solid solution. Aluminium and cobalt occupy equal numbers of sites. Highlighted bonds connect unlike neighbours.">
    {% set rows = ['ABBAAB', 'BABABA', 'BBAAAB', 'AABBBA'] %}
    <g class="bonds">
      {% for row in rows %}{% set r = loop.index0 %}
        {% for atom in row %}{% set c = loop.index0 %}{% set x = 49 + 49*c + 23*(r%2) %}{% set y = 37 + 38*r %}
          {% if c < 5 %}<path d="M{{ x }} {{ y }}h49"/>{% endif %}
          {% if r < 3 %}
            {% if c > 0 or r%2 %}<path d="M{{ x }} {{ y }}l-{{ 26 if r%2 == 0 else 23 }} 38"/>{% endif %}
            {% if c < 5 or r%2 == 0 %}<path d="M{{ x }} {{ y }}l{{ 23 if r%2 == 0 else 26 }} 38"/>{% endif %}
          {% endif %}
        {% endfor %}
      {% endfor %}
    </g>
    <g class="pair-path"><path d="M49 37l49 0"/><path d="M170 75l49 0"/><path d="M196 113l23 38"/></g>
    {% for row in rows %}{% set r = loop.index0 %}{% for atom in row %}
      <circle class="{{ 'al' if atom == 'A' else 'co' }}" cx="{{ 49 + 49*loop.index0 + 23*(r%2) }}" cy="{{ 37 + 38*r }}" r="10"/>
    {% endfor %}{% endfor %}
    <g class="legend"><circle class="al" cx="116" cy="192" r="5"/><text x="129" y="197">Al</text>
      <circle class="co" cx="205" cy="192" r="5"/><text x="218" y="197">Co</text></g>
  </svg>
  <figcaption>Site occupancy in a random AlCo solution. Highlighted bonds mark examples of unlike neighbours.</figcaption>
</figure>
