<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}MPEA stability{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='site.css') }}">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="wrap bar">
      <a class="brand" href="{{ url_for('index') }}">MPEA stability</a>
      <nav aria-label="Main navigation">
        <a href="{{ url_for('index') }}"{% if request.endpoint == 'index' %} aria-current="page"{% endif %}>Predict</a>
        <a href="{{ url_for('about') }}"{% if request.endpoint == 'about' %} aria-current="page"{% endif %}>About</a>
      </nav>
    </div>
  </header>
  <main id="main" class="wrap">{% block content %}{% endblock %}</main>
  <footer><div class="wrap bar"><span>MPEA stability · 2022–2026</span>
    <a href="https://github.com/wch3n/mpea_stability_flask">GitHub</a></div></footer>
</body>
</html>
