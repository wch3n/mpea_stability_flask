server.modules += ( "mod_proxy" )

$SERVER["socket"] == ":443" {
    $HTTP["host"] == "mpea.alloys.dev" {
        ssl.pemfile = "/etc/letsencrypt/live/mpea.alloys.dev/fullchain.pem"
        ssl.privkey = "/etc/letsencrypt/live/mpea.alloys.dev/privkey.pem"
    }
}

$HTTP["host"] == "mpea.alloys.dev" {
    # Certbot writes HTTP-01 tokens under the existing default document root.
    $HTTP["url"] !~ "^/[.]well-known/acme-challenge/" {
        $HTTP["scheme"] == "http" {
            url.redirect-code = 301
            url.redirect = ( "" => "https://mpea.alloys.dev${url.path}${qsa}" )
        } else {
            proxy.server = ( "" => (( "host" => "127.0.0.1", "port" => 8173 )) )
        }
    }
}
